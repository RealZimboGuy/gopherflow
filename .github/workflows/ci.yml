name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build release binary
        run: go build -o gopher-flow ./cmd/gopherflow

      # GopherFlow ships a pure-Go SQLite driver so the container needs no
      # special privileges. A cgo dependency creeping back in would silently
      # reintroduce that requirement, so fail the build if it does.
      - name: Assert the binary is statically linked
        run: |
          file gopher-flow
          if ! file gopher-flow | grep -q "statically linked"; then
            echo "::error::binary is not statically linked - a cgo dependency was reintroduced"
            exit 1
          fi

      - name: Assert no cgo SQLite driver is linked in
        run: |
          if go list -deps ./cmd/gopherflow | grep -q "mattn/go-sqlite3"; then
            echo "::error::github.com/mattn/go-sqlite3 is linked in - use modernc.org/sqlite"
            exit 1
          fi

      # Runs unit tests plus the integration suites, which start real MySQL and
      # Postgres via testcontainers against the Docker daemon on the runner.
      #
      # -p 1 runs one package at a time. Without it the MySQL, Postgres and
      # SQLite suites each start containers and a full engine concurrently,
      # which starves the runner and produces failures that look like flakes.
      #
      # -coverpkg attributes coverage to internal and pkg from whichever suite
      # exercises them. Without it the integration suites contribute nothing and
      # the reported figure roughly halves.
      #
      # -count=1 disables the test cache. A cached package reuses a profile
      # built against its source at cache time, so after any edit the merged
      # profile mixes stale and current line numbers and the total is wrong.
      - name: Test
        run: |
          go test -count=1 -p 1 -timeout 20m \
            -coverpkg=./internal/...,./pkg/... \
            -coverprofile=coverage.out \
            ./...
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.multistage
          push: false
          load: true
          tags: gopherflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must run under Docker's default seccomp profile. Before
      # v1.9.0 the cgo SQLite driver required --security-opt seccomp=unconfined.
      #
      # Uses a named volume so the mount inherits the image's nonroot ownership.
      # A host bind mount is covered separately below.
      - name: Smoke test under the default seccomp profile
        run: |
          docker run -d --name gflow-ci -p 8080:8080 \
            -e GFLOW_DATABASE_TYPE=SQLLITE \
            -e GFLOW_DATABASE_SQLLITE_FILE_NAME=/data/gflow.db \
            -v gflow-ci-data:/data \
            gopherflow:ci

          status="000"
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || echo "000")
            if [ "$status" = "200" ] || [ "$status" = "303" ]; then
              echo "console responded after ${i}s (HTTP $status)"
              break
            fi
            sleep 1
          done

          echo "--- container logs ---"
          docker logs gflow-ci 2>&1 || true
          echo "--- end logs ---"

          logs=$(docker logs gflow-ci 2>&1 || true)
          docker rm -f gflow-ci >/dev/null 2>&1 || true
          docker volume rm gflow-ci-data >/dev/null 2>&1 || true

          if [ "$status" != "200" ] && [ "$status" != "303" ]; then
            echo "::error::console did not come up (HTTP $status)"
            exit 1
          fi

          if echo "$logs" | grep -qiE "seccomp|operation not permitted|database is locked"; then
            echo "::error::container hit a seccomp or SQLite locking error"
            exit 1
          fi

          echo "image runs correctly under the default seccomp profile"

      # The README also documents a host bind mount with --user. A bind mount
      # keeps the host's ownership rather than the image's, so without --user
      # the nonroot user cannot create the database and the container dies.
      # This runs the documented command verbatim so it cannot regress.
      - name: Smoke test the documented host bind mount
        run: |
          mkdir -p "$RUNNER_TEMP/gflow-bind"
          echo "host dir owner: $(stat -c '%u:%g %a' "$RUNNER_TEMP/gflow-bind")"

          docker run -d --name gflow-bind -p 8081:8080 \
            -e GFLOW_DATABASE_TYPE=SQLLITE \
            -e GFLOW_DATABASE_SQLLITE_FILE_NAME=/data/gflow.db \
            -v "$RUNNER_TEMP/gflow-bind:/data" \
            --user "$(id -u):$(id -g)" \
            gopherflow:ci

          status="000"
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/ || echo "000")
            if [ "$status" = "200" ] || [ "$status" = "303" ]; then
              echo "console responded after ${i}s (HTTP $status)"
              break
            fi
            sleep 1
          done

          echo "--- container logs ---"
          docker logs gflow-bind 2>&1 || true
          echo "--- end logs ---"
          docker rm -f gflow-bind >/dev/null 2>&1 || true

          if [ "$status" != "200" ] && [ "$status" != "303" ]; then
            echo "::error::the documented bind-mount command does not work (HTTP $status)"
            exit 1
          fi

          if [ ! -f "$RUNNER_TEMP/gflow-bind/gflow.db" ]; then
            echo "::error::the database file was not created on the host bind mount"
            exit 1
          fi
          echo "bind mount works and the database landed on the host"
